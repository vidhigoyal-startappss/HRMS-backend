global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "server"
    metrics_path: "/api/metrics"
    static_configs:
      - targets: ["server:3000"]

  - job_name: "node_exporter"
    static_configs:
      - targets: ["node_exporter:9100"]
